    "/products/update": {
      "patch": {
        "tags": [
          "Produtos"
        ],
        "summary": "Atualizar produtos",
        "description": "## Update Products\n\nAtualiza informações de um ou mais produtos em lote.\n\n## Método\n\nPUT\n\n## Endpoint\n\n`/products/update`\n\n## Autenticação\n\nBearer Token obrigatório no header `Authorization`.\n\n## Parâmetros\n\nNão possui parâmetros.\n\n## Body\n\nArray de objetos contendo os produtos a serem atualizados.\n\n### Campos do Body\n\n- **produto** (number, obrigatório): Código identificador do produto.\n    \n- **padronizado** (string, obrigatório): Indica se o produto é padronizado.\n    \n    - Valores possíveis: `\"S\"` ou `\"N\"`\n        \n\n## Regras de Negócio\n\n- Apenas usuários autenticados podem executar esta operação.\n    \n- Todos os produtos informados devem existir no sistema.\n    \n- A atualização é realizada em lote.\n    \n- Caso algum produto seja inválido, a operação pode ser recusada.\n    \n\n## Exemplo de Request\n\n``` json\n[\n {\n   \"produto\": 10001,\n   \"padronizado\": \"S\"\n },\n {\n   \"produto\": 10002,\n   \"padronizado\": \"N\"\n }\n]\n\n ```",
        "responses": {
          "200": {
            "description": "Success response",
            "content": {
              "application/json": {
                "examples": {
                  "Success_response": {
                    "summary": "Success response",
                    "value": {
                      "message": "Atualização realizada.",
                      "productUpdated": 1
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Invalid token",
            "content": {
              "application/json": {
                "examples": {
                  "Invalid_token": {
                    "summary": "Invalid token",
                    "value": {
                      "message": "Token não fornecido"
                    }
                  }
                }
              }
            }
          },
          "206": {
            "description": "Partial success response",
            "content": {
              "application/json": {
                "examples": {
                  "Partial_success_response": {
                    "summary": "Partial success response",
                    "value": {
                      "message": "A atualização foi parcial. Nem todos os produtos foram atualizados.",
                      "productsUpdated": 1
                    }
                  }
                }
              }
            }
          }
        },
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "produto": {
                      "type": "string"
                    },
                    "padronizado": {
                      "type": "string"
                    }
                  },
                  "additionalProperties": true
                }
              },
              "example": [
                {
                  "produto": "{{cdProOne}}",
                  "padronizado": "S"
                }
              ]
            }
          }
        }
      }
    },
    "/billing-procedure/import": {
      "post": {
        "tags": [
          "Procedimentos de faturamento"
        ],
        "summary": "Carregar arquivo",
        "description": "## Upload\n\nRealiza o upload de um arquivo XLSX contendo informações de atualização de preços de procedimentos para processamento dentro da API.\n\n## Método\n\nPOST\n\n## Endpoint\n\n`/billing-procedures/import`\n\n## Autenticação\n\nBearer Token obrigatório no header `Authorization`.\n\n## Parâmetros\n\nNão possui parâmetros de URL.\n\n## Body\n\nTipo: `multipart/form-data`\n\n### Campos do Body\n\n- **file** (file, obrigatório): Arquivo XLSX contendo os dados de preços dos procedimentos.\n    \n\n## Regras de Negócio\n\n- Apenas usuários autenticados podem acessar esta rota.\n    \n- O arquivo deve estar no formato `.xlsx`.\n    \n- O arquivo é validado antes do processamento.\n    \n- Dados inválidos ou inconsistentes podem impedir o processamento.\n    \n- O processamento ocorre dentro da API, podendo ser síncrono ou assíncrono, conforme configuração do sistema.\n    \n\n## Exemplo de Request\n\n- Método: `POST`\n    \n- Content-Type: `multipart/form-data`\n    \n- Campo:\n    \n    - `file`: procedures_prices_update.xlsx\n        \n\n## Resposta de Sucesso\n\nArquivo recebido e processado com sucesso.\n\n## Exemplo de Resposta\n\n``` json\n{\n  \"status\": \"success\",\n  \"message\": \"Procedures prices file processed successfully\"\n}\n\n ```",
        "responses": {
          "200": {
            "description": "Requisição realizada com sucesso."
          },
          "401": {
            "description": "Não autenticado ou token inválido."
          }
        },
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "properties": {
                  "file": {
                    "type": "string",
                    "format": "binary"
                  }
                },
                "required": [
                  "file"
                ]
              }
            }
          }
        }
      }
    },
