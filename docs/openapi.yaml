    "/login": {
      "post": {
        "tags": [
          "Login"
        ],
        "summary": "Login",
        "description": "## Login\n\nRealiza a autenticação do usuário no sistema e retorna as informações necessárias para acesso às rotas protegidas.\n\n## Método\n\nPOST\n\n## Endpoint\n\n`/login`\n\n## Autenticação\n\nNão requer token.\n\n## Body\n\n- **username** (string, obrigatório): Nome de usuário cadastrado.\n    \n- **password** (string, obrigatório): Senha do usuário.\n    \n\n## Regras de Negócio\n\n- O usuário e a senha devem ser válidos.\n    \n- Caso as credenciais estejam incorretas, a autenticação é recusada.\n    \n\n## Respostas Esperadas\n\n- **200**: Login realizado com sucesso.\n    \n- **401**: Usuário ou senha inválidos.",
        "responses": {
          "200": {
            "description": "Success Response",
            "content": {
              "application/json": {
                "examples": {
                  "Success_Response": {
                    "summary": "Success Response",
                    "value": {
                      "tokens": "chave_token",
                      "role": "tipo_de_role"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Bad Response",
            "content": {
              "application/json": {
                "examples": {
                  "Bad_Response": {
                    "summary": "Bad Response",
                    "value": {
                      "error": "Usuário e senha são obrigatorios!"
                    }
                  }
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "username": {
                    "type": "string"
                  },
                  "password": {
                    "type": "string"
                  }
                },
                "additionalProperties": true
              },
              "example": {
                "username": "{{userLogged}}",
                "password": "{{passLogged}}"
              }
            }
          }
        }
      }
    },
    "/employees/all": {
      "get": {
        "tags": [
          "Funcionarios"
        ],
        "summary": "Todos os funcionarios",
        "description": "## All Employees\n\nRetorna a lista de todos os funcionários cadastrados no sistema.\n\n## Método\n\nGET\n\n## Endpoint\n\n`/employees/all`\n\n## Autenticação\n\nBearer Token obrigatório no header `Authorization`.\n\n## Parâmetros\n\nNão possui parâmetros.\n\n## Body\n\nNão se aplica.\n\n## Regras de Negócio\n\n- Apenas usuários autenticados podem acessar esta rota.\n    \n- Retorna informações básicas dos funcionários.\n    \n\n## Resposta de Sucesso\n\nRetorna um array de funcionários no seguinte formato:\n\n``` json\n[\n  {\n    \"CD_FUNC\": 501,\n    \"NM_FUNC\": \"Maria Santos\"\n  },\n  {\n    \"CD_FUNC\": 502,\n    \"NM_FUNC\": \"João Almeida\"\n  }\n]\n\n ```",
        "responses": {
          "200": {
            "description": "Success response",
            "content": {
              "application/json": {
                "examples": {
                  "Success_response": {
                    "summary": "Success response",
                    "value": [
                      {
                        "CD_FUNC": 123,
                        "NM_FUNC": "JOÃOZINHO DA SILVA E SILVA"
                      },
                      {
                        "CD_FUNC": 321,
                        "NM_FUNC": "SILVA DA SILVA JOAOZINHO"
                      }
                    ]
                  }
                }
              }
            }
          },
          "401": {
            "description": "Não autenticado ou token inválido."
          }
        },
        "security": [
          {
            "BearerAuth": []
          }
        ]
      }
    },
    "/hospital-beds/status": {
      "get": {
        "tags": [
          "Leitos Hospitalares"
        ],
        "summary": "Situação dos leitos hospitalares",
        "description": "## Hospital Beds Status\n\nRetorna o status atual dos leitos hospitalares.\n\n## Método\n\nGET\n\n## Endpoint\n\n`/hospaital-beds/status`\n\n## Autenticação\n\nBearer Token obrigatório no header `Authorization`.\n\n## Parâmetros\n\nNão possui parâmetros.\n\n## Body\n\nNão se aplica.\n\n## Regras de Negócio\n\n- Apenas usuários autenticados podem acessar esta rota.\n    \n- Retorna a situação atual dos leitos hospitalares do sistema.\n    \n\n## Resposta de Sucesso\n\nRetorna a lista de leitos e seus respectivos status.\n\n## Exemplo de Resposta\n\n``` json\n[\n    {\n        \"DS_UNID_INT\": \"UTI GERAL ADULTO\",\n        \"STATUS\": \"POS HIGIENIZACAO\",\n        \"TOTAL\": 1\n    },\n    {\n        \"DS_UNID_INT\": \"POSTO I\",\n        \"STATUS\": \"PARA HIGIENIZACAO\",\n        \"TOTAL\": 1\n    }\n]\n\n ```",
        "responses": {
          "200": {
            "description": "Success response",
            "content": {
              "application/json": {
                "examples": {
                  "Success_response": {
                    "summary": "Success response",
                    "value": [
                      {
                        "DS_UNID_INT": "POSTO II",
                        "STATUS": "POS HIGIENIZACAO",
                        "TOTAL": 2
                      }
                    ]
                  }
                }
              }
            }
          },
          "401": {
            "description": "Não autenticado ou token inválido."
          }
        },
        "security": [
          {
            "BearerAuth": []
          }
        ]
      }
    },
