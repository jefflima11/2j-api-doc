        ],
        "summary": "Solicitações aguardando confirmação",
        "description": "## Cleaning Requests Waiting Confirmation\n\nRetorna a lista de solicitações de limpeza de leitos que estão aguardando confirmação.\n\n## Método\n\nGET\n\n## Endpoint\n\n`/hospita-bdes/request-waiting-confirmation`\n\n## Autenticação\n\nBearer Token obrigatório no header `Authorization`.\n\n## Parâmetros\n\nNão possui parâmetros.\n\n## Body\n\nNão se aplica.\n\n## Regras de Negócio\n\n- Apenas usuários autenticados podem acessar esta rota.\n    \n- Retorna apenas solicitações que ainda não foram confirmadas.\n    \n- As informações são utilizadas para controle e acompanhamento operacional.\n    \n\n## Resposta de Sucesso\n\nRetorna um array de solicitações de limpeza pendentes de confirmação.\n\n## Exemplo de Resposta\n\n``` json\n{\n    \"waitingConfirmations\": [\n        {\n            \"DS_UNID_INT\": \"UTI GERAL ADULTO\",\n            \"STATUS\": \"POS HIGIENIZACAO\",\n            \"DS_LEITO\": \"U.T.I - LEITO 05\",\n            \"CD_SOLIC_LIMPEZA\": 94908,\n            \"DT_SOLIC_LIMPEZA\": \"2026-01-09T20:46:53.000Z\",\n            \"TP_SOLICITACAO\": \"Concorrente\",\n            \"NM_PACIENTE\": \"OCIMAR MICHEL CARVALHO DE SOUSA\"\n        },\n        {\n            \"DS_UNID_INT\": \"POSTO I\",\n            \"STATUS\": \"POS HIGIENIZACAO\",\n            \"DS_LEITO\": \"APARTAMENTO 113\",\n            \"CD_SOLIC_LIMPEZA\": 94902,\n            \"DT_SOLIC_LIMPEZA\": \"2026-01-09T19:56:40.000Z\",\n            \"TP_SOLICITACAO\": \"Concorrente\",\n            \"NM_PACIENTE\": \"ASDASDASD\"\n        }\n   ]\n}\n\n ```",
        "responses": {
          "200": {
            "description": "Success response",
