        "summary": "Pesquisa de satisfação por paciente",
        "description": "## Satisfaction Survey\n\nBusca a pesquisa de satisfação de um paciente.\n\n### Requisição\n\n**GET**\n\n```\n/satisfaction-survey/{cdPatient}\n\n ```\n\n**Exemplo**\n\n```\n/satisfaction-survey/12345\n\n ```\n\n### Autenticação\n\nEnviar token de acesso no header:\n\n``` javascript\nAuthorization: Bearer <token>\n\n ```\n\n### Dados necessários\n\n- **cdPatient**: código do paciente\n    \n- **Usuário e senha** no corpo da requisição\n    \n\n``` json\n{\n  \"username\": \"usuario\",\n  \"password\": \"senha\"\n}\n\n ```\n\n### Retorno\n\nRetorna as perguntas e respostas da pesquisa de satisfação do paciente.\n\n### Erros comuns\n\n- Token inválido\n    \n- Paciente não encontrado\n    \n- Erro interno\n    \n\nEndFragment",
        "responses": {
          "200": {
            "description": "Requisição realizada com sucesso."
          }
        },
        "parameters": [
          {
            "name": "cdPatient",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "username": {
                    "type": "string"
                  },
                  "password": {
                    "type": "string"
                  }
                },
                "additionalProperties": true
              },
              "example": {
                "username": "{{userLogged}}",
                "password": "{{passLogged}}"
              }
            }
          }
        }
      }
