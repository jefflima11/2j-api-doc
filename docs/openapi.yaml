        ],
        "summary": "Alteração de usuário",
        "description": "StartFragment\n\nAtualiza **dados parciais** de um usuário existente identificado pelo `username`.\n\n### Descrição\n\nEssa rota permite alterar informações específicas do usuário sem precisar reenviar o objeto inteiro. Atualiza apenas os campos enviados no body.\n\n---\n\n### Parâmetros de rota (Path Params)\n\n| Parâmetro | Tipo | Obrigatório | Descrição |\n| --- | --- | --- | --- |\n| username | string | Sim | Identificador único do usuário |\n\nExemplo:\n\n```\n/users/user-alter/jose.silva\n\n ```\n\n---\n\n### Body (JSON)\n\n```\n{\n  \"name\": \"string\",\n  \"role\": \"string\",\n  \"cpf\": 12345678900\n}\n\n ```\n\n#### Campos\n\n| Campo | Tipo | Obrigatório | Descrição |\n| --- | --- | --- | --- |\n| name | string | Não | Nome completo do usuário |\n| role | string | Não | Perfil / função do usuário |\n| cpf | number | Não | CPF do usuário (somente números) |\n\n### Exemplo de requisição\n\n```\nPATCH /users/user-alter/jose.silva\nContent-Type: application/json\n\n ```\n\n```\n{\n  \"role\": \"ADMIN\"\n}\n\n ```\n\n---\n\n### Respostas\n\n#### ✅ 200 – Sucesso\n\n```\n{\n  \"message\": \"User updated successfully\"\n}\n\n ```\n\n#### ❌ 404 – Usuário não encontrado\n\n```\n{\n  \"error\": \"User not found\"\n}\n\n ```\n\n#### ❌ 400 – Dados inválidos\n\n```\n{\n  \"error\": \"Invalid request body\"\n}\n\n ```\n\n#### ❌ 500 – Erro interno\n\n```\n{\n  \"error\": \"Internal server error\"\n}\n\n ```",
        "responses": {
          "401": {
            "description": "Invalid Token",
            "content": {
              "application/json": {
                "examples": {
                  "Invalid_Token": {
                    "summary": "Invalid Token",
                    "value": {
                      "message": "Token não fornecido"
                    }
                  }
                }
              }
            }
          }
        },
        "parameters": [
