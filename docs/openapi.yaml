    "/hospital-beds/update-cleaning-request/{requestId}": {
      "patch": {
        "tags": [
          "Leitos Hospitalares"
        ],
        "summary": "Atualizar solicitação de limpeza",
        "description": "## Update Cleaning Request\n\nAtualiza o status de uma solicitação de limpeza de leito hospitalar.\n\n## Método\n\nPATCH\n\n## Endpoint\n\n`/hospital-beds/update-cleaning-request/{requestId}`\n\n## Autenticação\n\nBearer Token obrigatório no header `Authorization`.\n\n## Parâmetros\n\n- **requestId** (path, obrigatório): Identificador da solicitação de limpeza.\n    \n\n## Body\n\nNão se aplica.\n\n## Regras de Negócio\n\n- Apenas usuários autenticados podem atualizar a solicitação.\n    \n- A solicitação deve existir no sistema.\n    \n- Após finalizada, a solicitação não pode ser alterada novamente.\n    \n\n## Exemplo de Request\n\n``` json\n{\n  \"updateCleaningRequest\": \"Limpeza iniciada com sucesso\"\n}\n\n ```\n\n## Respostas Esperadas\n\n- **200**: Limpeza iniciada com sucesso.\n    \n- **400**: Status inválido ou transição não permitida.\n    \n- **401**: Token ausente, inválido ou expirado.\n    \n- **404**: Solicitação não encontrada.",
        "responses": {
          "200": {
            "description": "Request started",
            "content": {
              "application/json": {
                "examples": {
                  "Request_started": {
                    "summary": "Request started",
                    "value": {
                      "updateCleaningRequest": "Limpeza iniciada com sucesso"
                    }
                  },
                  "After_cleaning_started": {
                    "summary": "After cleaning started",
                    "value": {
                      "updateCleaningRequest": "Pos higienizacao iniciada com sucesso"
                    }
                  },
                  "Request_completed": {
                    "summary": "Request completed",
                    "value": {
                      "updateCleaningRequest": "Solicitação aguardando confirmação ou já finalizada"
                    }
                  },
                  "Request_not_found": {
                    "summary": "Request not found",
                    "value": {
                      "updateCleaningRequest": "Solicitação não encontrada"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Invalid token",
            "content": {
              "application/json": {
                "examples": {
                  "Invalid_token": {
                    "summary": "Invalid token",
                    "value": {
                      "message": "Token não fornecido"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Resposta documentada na descrição da operação."
          },
          "404": {
            "description": "Resposta documentada na descrição da operação."
          }
        },
        "parameters": [
          {
            "name": "requestId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "security": [
          {
            "BearerAuth": []
          }
        ]
      }
    },
    "/hospital-beds/refuse-cleaning-request/{requestId}": {
      "patch": {
        "tags": [
          "Leitos Hospitalares"
        ],
        "summary": "Recusa da solicitação de limpeza",
        "description": "## Refuse Cleaning Request\n\nRecusa uma solicitação de limpeza de leito hospitalar, quando a solicitação não atende aos critérios esperados.\n\n## Método\n\nPATCH\n\n## Endpoint\n\n`/hospital-beds/refuse-cleaning-request/{requestId}`\n\n## Autenticação\n\nBearer Token obrigatório no header `Authorization`.\n\n## Parâmetros\n\n- **requestId** (path, obrigatório): Identificador da solicitação de limpeza.\n    \n\n## Body\n\nNão se aplica.\n\n## Regras de Negócio\n\n- Apenas usuários autenticados podem realizar a recusa.\n    \n- A solicitação deve existir no sistema.\n    \n- A solicitação deve estar em estado compatível para recusa.\n    \n- Solicitações já finalizadas não podem ser recusadas.\n    \n\n## Respostas\n\n### Recusa realizada com sucesso\n\n``` json\n{\n  \"refuseCleaningRequest\": \"Solicitação recusada com sucesso\"\n}\n\n ```",
        "responses": {
          "200": {
            "description": "Refuse confirm",
            "content": {
              "application/json": {
                "examples": {
                  "Refuse_confirm": {
                    "summary": "Refuse confirm",
                    "value": {
                      "refuseCleaningRequest": "Solicitação de limpeza recusada com sucesso"
                    }
                  },
                  "Request_not_found": {
                    "summary": "Request not found",
                    "value": {
                      "refuseCleaningRequest": "Solicitação não encontrada"
                    }
                  },
                  "Request_still_in_progress": {
                    "summary": "Request still in progress",
                    "value": {
                      "refuseCleaningRequest": "Solicitação não esta em estado de limpeza finalizada para recusa"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Não autenticado ou token inválido."
          }
        },
        "parameters": [
          {
            "name": "requestId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "security": [
          {
            "BearerAuth": []
          }
        ]
      }
    },
    "/hospital-beds/confirm-cleaning-request/{requestId}": {
      "patch": {
        "tags": [
          "Leitos Hospitalares"
        ],
        "summary": "Confirmação da solicitação de limpeza",
        "description": "## Confirm Cleaning Request\n\nConfirma uma solicitação de limpeza de leito hospitalar, vinculando um funcionário responsável pela execução.\n\n## Método\n\nPATCH\n\n## Endpoint\n\n`/hospital-beds/confirm-cleaning-request/{requestId}`\n\n## Autenticação\n\nBearer Token obrigatório no header `Authorization`.\n\n## Parâmetros\n\n- **requestId** (path, obrigatório): Identificador da solicitação de limpeza.\n    \n\n## Body\n\n- **employee** (number, obrigatório): Identificador do funcionário responsável pela limpeza.\n    \n- **observation** (string, opcional): Observação complementar sobre a confirmação da limpeza.\n    \n\n## Regras de Negócio\n\n- Apenas usuários autenticados podem confirmar solicitações.\n    \n- O funcionário informado deve existir no sistema.\n    \n- A solicitação deve existir e não pode estar previamente confirmada.\n    \n- Após confirmada, a solicitação segue o fluxo normal de finalização.\n    \n\n## Exemplo de Request\n\n``` json\n{\n  \"employee\": 845,\n  \"observation\": \"Limpeza iniciada conforme protocolo\"\n}\n\n ```",
        "responses": {
          "200": {
            "description": "Employee not found",
            "content": {
              "application/json": {
                "examples": {
                  "Employee_not_found": {
                    "summary": "Employee not found",
                    "value": {
                      "confirmCleaningRequest": "Funcionário não encontrado"
                    }
                  },
                  "Request_not_found_or_confirmed": {
                    "summary": "Request not found or confirmed",
                    "value": {
                      "confirmCleaningRequest": "Solicitação não encontrada ou já foi confirmada anteriormente"
                    }
                  },
                  "Confirmation_complete": {
                    "summary": "Confirmation complete",
                    "value": {
                      "confirmCleaningRequest": "Solicitação de limpeza confirmada com sucesso"
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "Não autenticado ou token inválido."
          }
        },
        "parameters": [
          {
            "name": "requestId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "security": [
          {
            "BearerAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "observation": {
                    "type": "string"
                  }
                },
                "additionalProperties": true
              },
              "example": {
                "observation": "{{observation}}"
              }
            }
          }
        }
      }
    },
