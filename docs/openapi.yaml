        "summary": "Solicitações de limpeza",
        "description": "## Cleaning Request\n\nRetorna as solicitações de limpeza hospitalares.\n\n## Método\n\nGET\n\n## Endpoint\n\n`/hospital-beds/cleaning-request`\n\n## Autenticação\n\nBearer Token obrigatório no header `Authorization`.\n\n## Parâmetros\n\nNão possui parâmetros.\n\n## Body\n\nNão se aplica.\n\n## Regras de Negócio\n\n- Apenas usuários autenticados podem realizar a solicitação.\n    \n- O leito deve existir no sistema.\n    \n\n## Exemplo de Request\n\n``` json\n{\n    \"cleaningRequests\": [\n        {\n            \"DS_UNID_INT\": \"POSTO II\",\n            \"STATUS\": \"PARA HIGIENIZACAO\",\n            \"DS_LEITO\": \"APARTAMENTO 213\",\n            \"CD_SOLIC_LIMPEZA\": 94903,\n            \"DT_SOLIC_LIMPEZA\": \"2026-01-09T19:56:54.000Z\",\n            \"TP_SOLICITACAO\": \"Concorrente\",\n            \"NM_PACIENTE\": \"TESTE TESTE TESTE\"\n        },\n        {\n            \"DS_UNID_INT\": \"POSTO I\",\n            \"STATUS\": \"PARA HIGIENIZACAO\",\n            \"DS_LEITO\": \"APARTAMENTO 116\",\n            \"CD_SOLIC_LIMPEZA\": 94904,\n            \"DT_SOLIC_LIMPEZA\": \"2026-01-09T19:57:08.000Z\",\n            \"TP_SOLICITACAO\": \"Concorrente\",\n            \"NM_PACIENTE\": \"ASDASDASD\"\n        }\n    ]\n}\n\n ```",
        "responses": {
